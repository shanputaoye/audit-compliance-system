<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>技改项目验收审计 — 智能合规管理系统（开源版）</title>
<style>
:root{--bg:#f4f5f7;--s:#fff;--bd:#dfe2e7;--t:#1d2129;--t2:#5a6170;--t3:#8f95a3;--p:#1b5e3f;--pl:#e8f5ee;--a:#2a6496;--al:#eef5fb;--su:#1f7d3a;--w:#b3540e;--d:#c22d3a;--ai:#7c3aed;--ai-bg:#faf5ff;--r:6px;--f:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:var(--bg);color:var(--t);display:flex;min-height:100vh;line-height:1.55;overflow-x:hidden}
/* LEFT SIDEBAR */
.sidebar{width:200px;background:#14181f;color:#8a8f9a;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;flex-shrink:0;overflow-y:auto}
.sidebar-header{padding:14px 12px 11px;border-bottom:1px solid rgba(255,255,255,.06)}
.sidebar-header .logo{font-size:12px;font-weight:700;color:#fff}.sidebar-header .logo span{color:#4aad6e}
.sidebar-header .sub{font-size:8.5px;opacity:.5;margin-top:1px}
.nav-sec{padding:8px 12px 2px;font-size:8px;text-transform:uppercase;letter-spacing:.1em;opacity:.35;font-weight:600}
.nav-item{display:flex;align-items:center;gap:7px;padding:7px 12px;margin:1px 5px;border-radius:var(--r);cursor:pointer;font-size:11px;color:#8a8f9a;transition:.15s;border:none;background:none;width:calc(100% - 10px);text-align:left}
.nav-item:hover{background:#1e232c;color:#c8cdd5}
.nav-item.active{background:var(--p);color:#fff}.nav-item .i{font-size:12px;width:16px;text-align:center;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--w);color:#fff;font-size:8px;padding:1px 5px;border-radius:7px;font-weight:600;min-width:15px;text-align:center}
.nav-badge.good{background:var(--su)}
.sidebar-footer{padding:10px 12px;border-top:1px solid rgba(255,255,255,.04);font-size:8px;opacity:.35}

/* MAIN WRAPPER */
.main-wrapper{display:flex;flex:1;margin-left:200px;min-height:100vh;position:relative}
.main{flex:1;display:flex;flex-direction:column;min-width:0;transition:margin-right .3s}
.main.ai-open{margin-right:340px}

/* AI PANEL */
.ai-panel{position:fixed;top:0;right:0;bottom:0;width:340px;background:var(--s);border-left:1px solid var(--bd);z-index:90;display:flex;flex-direction:column;transform:translateX(0);transition:transform .3s}
.ai-panel.collapsed{transform:translateX(300px)}
.ai-toggle{position:fixed;right:0;top:50%;transform:translateY(-50%);width:28px;height:60px;background:var(--ai);color:#fff;border:none;border-radius:8px 0 0 8px;cursor:pointer;z-index:91;font-size:12px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-lr;letter-spacing:2px;font-family:var(--f)}
.ai-panel:not(.collapsed)+.ai-toggle{right:340px;background:var(--bd);color:var(--t2)}
.ai-head{padding:11px 14px;border-bottom:1px solid var(--bd);background:linear-gradient(135deg,#faf5ff,#f3e8ff);display:flex;align-items:center;justify-content:space-between;gap:8px}
.ai-head h3{font-size:12.5px;color:var(--ai);display:flex;align-items:center;gap:6px}
.ai-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.ai-section{border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.ai-section .ai-shead{padding:8px 10px;background:#fafbfc;border-bottom:1px solid var(--bd);font-size:10.5px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between}
.ai-section .ai-sbody{padding:8px 10px;font-size:10.5px;max-height:180px;overflow-y:auto}
.ai-chat{border-top:1px solid var(--bd);padding:8px 10px;display:flex;gap:6px}
.ai-chat input{flex:1;padding:6px 8px;border:1px solid var(--bd);border-radius:var(--r);font-size:10.5px;font-family:var(--f);outline:none}
.ai-chat input:focus{border-color:var(--ai)}
.ai-chat button{padding:6px 10px;background:var(--ai);color:#fff;border:none;border-radius:var(--r);cursor:pointer;font-size:10.5px;white-space:nowrap}
.ai-msg{padding:6px 8px;border-radius:4px;margin-bottom:6px;font-size:10px;line-height:1.5}
.ai-msg.user{background:var(--ai-bg);color:var(--ai);text-align:right}
.ai-msg.bot{background:#f4f5f7;color:var(--t2)}
.ai-msg .meta{font-size:8px;color:var(--t3);margin-top:2px}

/* TOPBAR */
.topbar{background:var(--s);border-bottom:1px solid var(--bd);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;gap:8px}
.topbar-left{display:flex;align-items:center;gap:8px;min-width:0}.topbar-title{font-size:13px;font-weight:600;white-space:nowrap}
.topbar-proj{font-size:9.5px;color:var(--t3);padding:2px 7px;background:#f0f1f3;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.topbar-actions{display:flex;gap:4px;flex-shrink:0}
.content{padding:12px 16px;flex:1}.view{display:none}.view.active{display:block}

.btn{display:inline-flex;align-items:center;gap:3px;padding:5px 10px;border-radius:var(--r);font-size:10.5px;font-weight:500;font-family:var(--f);cursor:pointer;border:1px solid transparent;transition:.15s;white-space:nowrap}
.btn-p{background:var(--p);color:#fff}.btn-p:hover{background:#124a30}
.btn-s{background:var(--s);color:var(--t2);border-color:var(--bd)}.btn-s:hover{background:#f0f1f3}
.btn-xs{padding:3px 6px;font-size:9px;border-radius:3px}
.btn-gh{background:transparent;border-color:transparent;color:var(--t2)}.btn-gh:hover{background:rgba(0,0,0,.03)}
.btn-out{background:transparent;border-color:var(--p);color:var(--p)}.btn-out:hover{background:var(--pl)}

.sgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.scard{background:var(--s);border:1px solid var(--bd);border-radius:var(--r);padding:12px}
.scard .sl{font-size:9.5px;color:var(--t3);margin-bottom:2px}.scard .sv{font-size:18px;font-weight:700}
.scard .ss{font-size:9px;color:var(--t3)}.scard.good .sv{color:var(--su)}.scard.warn .sv{color:var(--w)}.scard.bad .sv{color:var(--d)}

.prow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.panel{background:var(--s);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.phead{padding:9px 12px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;background:#fafbfc;gap:6px}
.phead h3{font-size:11.5px;font-weight:600;white-space:nowrap}.pbody{padding:10px 12px}

.cat-card{background:var(--s);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.cat-head{padding:8px 12px;background:#fafbfc;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:6px}
.cat-head h3{font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:5px}
.cat-num{background:var(--p);color:#fff;min-width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.row{display:flex;align-items:center;padding:6px 12px;border-bottom:1px solid #f0f1f3;gap:6px;font-size:10.5px;cursor:pointer;transition:.1s}
.row:hover{background:#fafbfc}.row:last-child{border-bottom:none}

.badge{display:inline-flex;align-items:center;gap:2px;padding:2px 6px;border-radius:6px;font-size:8.5px;font-weight:600}
.badge-ok{background:var(--pl);color:var(--su)}.badge-warn{background:#fef6ee;color:var(--w)}
.badge-err{background:#fef0f1;color:var(--d)}.badge-info{background:var(--al);color:var(--a)}
.badge-pending{background:#f0f1f3;color:var(--t3)}.badge-ai{background:#f3e8ff;color:var(--ai)}

.gantt{overflow-x:auto;font-size:9.5px}.gantt-row{display:flex;align-items:center;border-bottom:1px solid #f0f1f3;padding:2px 0}
.gantt-label{width:110px;flex-shrink:0;font-weight:500;font-size:9px;padding-right:4px}
.gantt-bar-area{flex:1;position:relative;height:16px;background:#f4f5f7;border-radius:3px;min-width:140px}
.gantt-bar{position:absolute;top:2px;height:12px;border-radius:3px;display:flex;align-items:center;padding:0 3px;font-size:7.5px;color:#fff}
.gantt-bar.done{background:var(--su)}.gantt-bar.ongoing{background:var(--a)}.gantt-bar.late{background:var(--d)}.gantt-bar.future{background:#c8ccd2}
.gantt-today{position:absolute;top:0;bottom:0;width:1.5px;background:var(--d);z-index:2}

.tbl-wrap{background:var(--s);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.tbl-bar{padding:7px 10px;border-bottom:1px solid var(--bd);display:flex;gap:5px;align-items:center;flex-wrap:wrap;font-size:10px}
.tbl-bar input[type=text],.tbl-bar select{padding:4px 7px;border:1px solid var(--bd);border-radius:var(--r);font-size:10.5px;font-family:var(--f);outline:none;background:var(--s)}
.tbl-bar input[type=text]:focus,.tbl-bar select:focus{border-color:var(--p)}
.tbl-bar input[type=text]{width:130px}.spacer{flex:1}
table{width:100%;border-collapse:collapse;font-size:10.5px}
thead th{text-align:left;padding:6px 8px;font-weight:600;font-size:9.5px;color:var(--t3);background:#fafbfc;border-bottom:1px solid var(--bd);white-space:nowrap}
tbody td{padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}
tbody tr:hover{background:#fafbfc}tbody tr:last-child td{border-bottom:none}
.stage-dots{display:flex;gap:1.5px}.sdot{width:5px;height:5px;border-radius:50%}.sdot.ok{background:var(--su)}.sdot.issue{background:var(--w)}.sdot.pending{background:#d1d5db}

.ver-item{padding:4px 7px;border:1px solid var(--bd);border-radius:3px;margin-bottom:2px;display:flex;gap:4px;align-items:flex-start;font-size:9.5px}
.ver-item.current{border-color:var(--p);background:var(--pl)}.ver-item .vn{min-width:14px;font-weight:700;color:var(--p);font-size:8.5px;text-align:center}
.ver-item .vc{flex:1}.ver-item .vd{font-size:8px;color:var(--t3);white-space:nowrap}

.alert-item{padding:7px 10px;margin-bottom:3px;border-radius:var(--r);display:flex;align-items:flex-start;gap:5px;font-size:10px}
.alert-item.critical{background:var(--d);color:#fff}.alert-item.warning{background:#fef6ee;border:1px solid #ffeeba}

.dept-card{border:1px solid var(--bd);border-radius:var(--r);padding:10px;background:#fafbfc;margin-bottom:6px;font-size:10.5px}
.dept-card.inactive{opacity:.6;border-style:dashed}

.empty-st{text-align:center;padding:30px 10px;color:var(--t3);font-size:10.5px}
.empty-st .eicon{font-size:24px;margin-bottom:6px;opacity:.25}

/* Person-deliverables group */
.person-group{margin-bottom:10px;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.person-group .pg-head{padding:8px 12px;background:var(--al);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:6px}
.person-group .pg-head h4{font-size:11px;font-weight:600;color:var(--a)}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:1000;justify-content:center;align-items:flex-start;padding:16px 12px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal{background:var(--s);border-radius:8px;width:100%;max-width:600px;box-shadow:0 4px 20px rgba(0,0,0,.1);animation:si .15s ease}
@keyframes si{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.modal-head{padding:11px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.modal-head h2{font-size:12.5px;font-weight:600}.modal-close{width:22px;height:22px;border:none;background:none;cursor:pointer;border-radius:var(--r);font-size:13px;color:var(--t3)}
.modal-close:hover{background:#f0f1f3;color:var(--t)}.modal-body{padding:12px 14px}
.modal-foot{padding:9px 14px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:4px}
.form-g{margin-bottom:9px}.form-g label{display:block;font-size:10.5px;font-weight:600;margin-bottom:2px}
.form-g .hint{font-size:9px;color:var(--t3)}.form-g .err{font-size:9px;color:var(--d);display:none}
.form-g.has-err .err{display:block}.form-g.has-err .form-input{border-color:var(--d)}
.form-input{width:100%;padding:5px 7px;border:1px solid var(--bd);border-radius:var(--r);font-size:10.5px;font-family:var(--f);outline:none;background:var(--s)}
.form-input:focus{border-color:var(--p);box-shadow:0 0 0 2px rgba(27,94,63,.06)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
textarea.form-input{resize:vertical;min-height:45px}
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:5px;flex-wrap:wrap}

@media(max-width:1200px){.sgrid{grid-template-columns:repeat(3,1fr)}.ai-panel{width:300px}.main.ai-open{margin-right:300px}}
@media(max-width:768px){.sgrid{grid-template-columns:1fr 1fr}.prow{grid-template-columns:1fr}
  .sidebar{width:44px}.sidebar>*:not(nav){display:none}.nav-item span:not(.i){display:none}.nav-item{justify-content:center;padding:8px}
  .main-wrapper{margin-left:44px}.ai-panel{width:280px;z-index:95}.main.ai-open{margin-right:280px}}
@media print{.sidebar,.ai-panel,.ai-toggle,.topbar,.btn,.modal-overlay{display:none!important}.main-wrapper{margin-left:0!important}.main{margin-right:0!important}.content{padding:0!important}}

/* === Wizard === */
.wiz-steps{display:flex;gap:0;border-bottom:1px solid var(--bd);padding:6px 10px;background:#fafbfc;font-size:9.5px}
.wiz-step-item{flex:1;text-align:center;padding:5px 3px;font-size:9px;color:var(--t3);border-bottom:2px solid transparent;cursor:default}
.wiz-step-item.active{color:var(--p);border-bottom-color:var(--p);font-weight:600}
.wiz-step-item.done{color:var(--su);border-bottom-color:var(--su)}
.wiz-chk-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:10px}
.wiz-chk-grid label{display:flex;align-items:center;gap:4px;cursor:pointer}
.wiz-mod-row{border:1px solid var(--bd);border-radius:4px;padding:8px;margin-bottom:6px;background:#fafbfc}
.wiz-mod-row.active{border-color:var(--p);background:var(--pl)}
.wiz-ind-row{display:flex;gap:4px;margin-top:3px;font-size:10px}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-header"><div class="logo"><span>&#9678;</span> 智能合规系统</div><div class="sub">验收审计 | AI驱动</div></div>
  <nav class="sidebar-nav">
    <div class="nav-sec">概览</div>
    <button class="nav-item active" data-view="dash"><span class="i">&#9681;</span><span>仪表盘</span></button>
    <div class="nav-sec">数据管理</div>
    <button class="nav-item" data-view="docs"><span class="i">&#128196;</span><span>数据源中心</span><span class="nav-badge" id="badge-docs">0</span></button>
    <button class="nav-item" data-view="indicators"><span class="i">&#9638;</span><span>指标闭环</span><span class="nav-badge" id="badge-inds">0</span></button>
    <button class="nav-item" data-view="materials"><span class="i">&#9745;</span><span>材料清单</span><span class="nav-badge" id="badge-mats">0</span></button>
    <div class="nav-sec">组织</div>
    <button class="nav-item" data-view="org"><span class="i">&#128101;</span><span>组织架构</span></button>
    <div class="nav-sec">审查</div>
    <button class="nav-item" data-view="review"><span class="i">&#128269;</span><span>审核中心</span><span class="nav-badge" id="badge-review">0</span></button>
    <button class="nav-item" data-view="gantt"><span class="i">&#9200;</span><span>进度节点</span><span class="nav-badge" id="badge-overdue">0</span></button>
    <div class="nav-sec">输出</div>
    <button class="nav-item" data-view="report"><span class="i">&#9998;</span><span>审计报告</span></button>
    <button class="nav-item" data-view="tpl"><span class="i">&#9881;</span><span>模板</span></button>
  </nav>
  <div class="sidebar-footer">v7.0 | AI常驻助手</div>
</aside>

<div class="main-wrapper">
  <div class="main ai-open" id="mainArea">
    <div class="topbar">
      <div class="topbar-left"><span class="topbar-title" id="topbarTitle">仪表盘</span><span class="topbar-proj" id="topbarProj"></span></div>
      <div class="topbar-actions">
        <select id="selProj" style="padding:3px 6px;border:1px solid var(--bd);border-radius:var(--r);font-size:10px;font-family:var(--f);background:var(--s);outline:none;max-width:160px" onchange="swProj(this.value)"></select>
        <button class="btn btn-p btn-xs" onclick="quickAdd()">+ 新增</button>
        <button class="btn btn-s btn-xs" onclick="exp()">导出</button>
        <button class="btn btn-s btn-xs" onclick="imp()">导入</button>
      </div>
    </div>
    <div class="content">
      <div class="view active" id="view-dash"><div class="sgrid" id="ds"></div><div class="prow"><div class="panel"><div class="phead"><h3>&#9200; 里程碑</h3></div><div class="pbody gantt" id="dg"></div></div><div class="panel"><div class="phead"><h3>&#9888; 预警</h3></div><div class="pbody" id="da"></div></div></div></div>
      <div class="view" id="view-docs"><div id="docsContent"></div></div>
      <div class="view" id="view-indicators"><div id="indContent"></div></div>
      <div class="view" id="view-materials"><div id="matContent"></div></div>
      <div class="view" id="view-org"><div id="orgContent"></div></div>
      <div class="view" id="view-review"><div id="reviewContent"></div></div>
      <div class="view" id="view-gantt"><div id="ganttContent"></div></div>
      <div class="view" id="view-report"><div id="reportContent"></div></div>
      <div class="view" id="view-tpl"><div id="tplContent"></div></div>
    </div>
  </div>

  <!-- AI PANEL -->
  <div class="ai-panel" id="aiPanel">
    <div class="ai-head">
      <h3>&#9889; <span id="aiHeadTitle">AI 智能助手</span></h3>
      <button class="btn btn-xs btn-gh" onclick="toggleAI()" title="收起面板">◀</button>
    </div>
    <div class="ai-body" id="aiBody"></div>
    <div class="ai-chat">
      <input type="text" id="aiInput" placeholder="输入问题..." onkeydown="if(event.key==='Enter')aiSend()">
      <button onclick="aiSend()">发送</button>
    </div>
  </div>
  <button class="ai-toggle" id="aiToggle" onclick="toggleAI()" style="display:none">AI 助手</button>
</div>

<!-- DELIVERABLE MODAL (owner is mandatory) -->
<div class="modal-overlay" id="docModal"><div class="modal"><div class="modal-head"><h2 id="docMTitle">导入交付物</h2><button class="modal-close" onclick="closeDocM()">&times;</button></div><div class="modal-body">
  <div class="form-row"><div class="form-g"><label>名称*</label><input class="form-input" id="fdname"></div><div class="form-g"><label>类型*</label><select class="form-input" id="fdtype"><option value="招标文件">招标文件</option><option value="合同">合同</option><option value="技术协议">技术协议</option><option value="交付物">交付物</option><option value="其他">其他</option></select></div></div>
  <div class="form-row">
    <div class="form-g has-err"><label>归属责任人*</label><select class="form-input" id="fdowner"><option value="">-- 请选择 --</option></select><div class="err">必须指定责任人</div></div>
    <div class="form-g"><label>版本号</label><input class="form-input" id="fdver" value="V1.0"></div></div>
  <div class="form-row"><div class="form-g"><label>文件路径/编号</label><input class="form-input" id="fdfile" placeholder="如：招标文件-环控平台.doc"></div>
    <div class="form-g"><label>状态</label><select class="form-input" id="fdstatus"><option value="draft">草稿</option><option value="finalized">已定稿</option><option value="obsolete">已作废</option></select></div></div>
  <div class="form-g"><label>关联指标</label><select class="form-input" id="fdlinked" multiple style="min-height:50px"></select></div>
  <div class="form-g"><label>说明/变更记录</label><textarea class="form-input" id="fddesc" rows="2"></textarea></div>
  <input type="hidden" id="fdid">
</div><div class="modal-foot"><button class="btn btn-s" onclick="closeDocM()">取消</button><button class="btn btn-p" onclick="saveDoc()">保存</button></div></div></div>

<!-- INDICATOR MODAL -->
<div class="modal-overlay" id="indModal"><div class="modal"><div class="modal-head"><h2 id="indMTitle">编辑指标</h2><button class="modal-close" onclick="closeIndM()">&times;</button></div><div class="modal-body">
  <div class="form-row"><div class="form-g"><label>名称*</label><input class="form-input" id="finame"></div><div class="form-g"><label>模块</label><select class="form-input" id="fimodule"></select></div></div>

function saveDoc(){
  const p=AP();if(!p)return;const name=document.getElementById('fdname').value.trim();
  const owner=document.getElementById('fdowner').value;
  if(!name){alert('请输入名称');return}
  if(!owner){document.getElementById('fdowner').parentElement.classList.add('has-err');return}
  document.getElementById('fdowner').parentElement.classList.remove('has-err');
  const si=Array.from(document.getElementById('fdlinked').selectedOptions).map(o=>o.value);
  const obj={id:edid||uid(),name,type:document.getElementById('fdtype').value,ver:document.getElementById('fdver').value.trim(),
    file:document.getElementById('fdfile').value.trim(),owner,status:document.getElementById('fdstatus').value,
    desc:document.getElementById('fddesc').value.trim(),linked:si};
  if(edid){const idx=p.deliverables.findIndex(d=>d.id===edid);if(idx>=0){const old=p.deliverables[idx];obj.hist=old.hist||[];if(obj.ver!==old.ver)obj.hist.push({ver:obj.ver,date:nw(),op:'系统',note:'版本更新：'+old.ver+'→'+obj.ver});obj.aiContent=old.aiContent;p.deliverables[idx]=obj}}
  else{obj.hist=[{ver:obj.ver,date:nw(),op:owner,note:'初始导入'}];p.deliverables.push(obj)}
  (p.indicators||[]).forEach(i=>{if(!i.linkedDocs)i.linkedDocs=[];i.linkedDocs=i.linkedDocs.filter(did=>did!==(edid||obj.id))});
  si.forEach(iid=>{const ind=p.indicators.find(ii=>ii.id===iid);if(ind&&!ind.linkedDocs.includes(obj.id))ind.linkedDocs.push(obj.id)});
  save();closeDocM();refresh();
}

  h+='<div style="background:var(--ai-bg);border:1px solid #c4b5fd;border-radius:4px;padding:8px 10px;margin-bottom:8px">';
  h+='<strong style="color:var(--ai);font-size:11px">正在分析：'+esc(ind.name)+'</strong>';
  h+='<div style="font-size:9px;color:var(--t3);margin-top:2px">目标：「'+esc(ind.target||'未设置')+'」 · 责任人：'+pn(p,ind.owner)+'</div>';
  h+='</div>';

  // Stage status
  h+='<div style="font-size:10.5px;margin-bottom:8px"><strong>五阶段状态分析</strong></div>';
  h+='<table style="width:100%;font-size:9.5px;margin-bottom:8px">';
  stages.forEach(function(s,i){
    var cl=s.wf==='approved'?'var(--su)':s.wf==='rejected'?'var(--d)':s.wf==='draft'||s.wf==='submitted'?'var(--w)':'var(--t3)';
    var st=s.wf==='approved'?'✓ 完成':s.wf==='rejected'?'✗ 驳回':s.wf==='draft'?'⚙ 草稿':s.wf==='submitted'?'→ 审核中':'· 未开始';
    h+='<tr><td style="padding:3px 4px">'+(i+1)+'. '+s.label+'</td><td style="color:'+cl+'">'+st+'</td></tr>';
    if(s.wf==='rejected'&&s.evid)h+='<tr><td></td><td style="font-size:8px;color:var(--d)">原因：'+esc(s.evid)+'</td></tr>';
  });
  h+='</table>';
  h+='<div style="font-size:10px;margin-bottom:6px">完成进度：<strong>'+done+'/5</strong> 阶段</div>';

  // Suggestions
  h+='<div style="font-size:10.5px;margin-bottom:6px"><strong>闭环建议</strong></div>';
  if(done===5){
    h+='<div style="color:var(--su);font-size:10px">✅ 该指标已形成完整闭环，无需进一步操作。</div>';
  }else if(broken.length>0){
    h+='<div style="color:var(--d);font-size:10px">⚠ 存在驳回项：'+broken.map(function(s){return s.label}).join('、')+'。<br>建议：重新修订被驳回阶段的材料，修正后重新提交审核。</div>';
  }else if(pending.length>0){
    var next=pending[0];
    h+='<div style="color:var(--w);font-size:10px">下一步建议：启动「<strong>'+next.label+'</strong>」阶段的编制工作。<br>';
    if(linkedDocs.length>0){
      h+='可参考的交付物：'+linkedDocs.map(function(d){return d.name+'('+d.status+')'}).join('、')+'<br>';
      var finalized=linkedDocs.filter(function(d){return d.status==='finalized'});
      if(finalized.length>0)h+='<span style="color:var(--su)">✓ '+finalized.length+'份已定稿交付物可为该阶段提供证据支撑</span>';
    }
    h+='</div>';
  }

  // Linked deliverables
  if(linkedDocs.length>0){
    h+='<div style="font-size:10px;margin-top:8px"><strong>关联交付物 ('+linkedDocs.length+'份)</strong></div>';
    linkedDocs.forEach(function(d){
      var st=d.status==='finalized'?'已定稿':d.status==='draft'?'草稿':'已作废';
      h+='<div style="font-size:9px;padding:2px 0">· '+esc(d.name)+' <span style="color:'+(d.status==='finalized'?'var(--su)':'var(--t3)')+'">['+st+']</span></div>';
    });
  }

  // Push notification button
  h+='<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--bd)">';
  h+='<button class="btn btn-xs" style="background:var(--ai);color:#fff;width:100%;margin-bottom:3px" onclick="aiPushNotify(\''+ind.id+'\')">📨 推送状态给责任人</button>';
  h+='<div style="font-size:8px;color:var(--t3)">深化应用：将当前指标分析报告推送给 '+pn(p,ind.owner)+'，通知其进行下一步操作。</div>';
  h+='</div>';

  // Render to AI panel
  var body=document.getElementById('aiBody');
  body.innerHTML='<div style="padding:4px;font-size:10px">'+h+'</div>';
  // Also add message
  setTimeout(function(){addAIMsg('已分析「'+esc(ind.name)+'」：'+done+'/5阶段完成'+(broken.length?'，'+broken.length+'处驳回':'')+(pending.length?'，建议下一步：'+pending[0].label:'')+'。');},100);
}

function aiAnalyzeMaterial(id){
  var p=AP();if(!p)return;
  var m=p.materials.find(function(mm){return mm.id===id});if(!m)return;
  var wfLabels={approved:'已定稿',submitted:'审核中',draft:'编制中',rejected:'退回修订',pending:'待启动'};
  var linkedInds=(m.linkedInds||[]).map(function(iid){return p.indicators.find(function(i){return i.id===iid})}).filter(Boolean);
  var linkedDocs=(m.linkedDocs||[]).map(function(did){return p.deliverables.find(function(d){return d.id===did})}).filter(Boolean);

  var h='';
  h+='<div style="background:var(--ai-bg);border:1px solid #c4b5fd;border-radius:4px;padding:8px 10px;margin-bottom:8px">';
  h+='<strong style="color:var(--ai);font-size:11px">正在分析：'+esc(m.name)+'</strong>';
  h+='<div style="font-size:9px;color:var(--t3);margin-top:2px">类别：'+cn(p,m.cat)+' · 状态：'+wfLabels[m.wf]+' · v'+m.ver+'</div>';
  h+='</div>';

  if(m.wf==='rejected'){
    h+='<div style="color:var(--d);font-size:10px;margin-bottom:8px">⚠ 该材料已被退回修订<br>原因：'+esc(m.rjReason||'未说明')+'<br>建议：修正后重新提交审核。</div>';
  }else if(m.wf==='approved'){
    h+='<div style="color:var(--su);font-size:10px;margin-bottom:8px">✅ 该材料已定稿，合规状态良好。</div>';
  }else if(m.wf==='pending'){
    h+='<div style="color:var(--w);font-size:10px;margin-bottom:8px">⚠ 该材料尚未启动编制。<br>建议：尽快启动编制，审计依据：'+esc(m.rule||'无')+'</div>';
  }else{
    h+='<div style="color:var(--w);font-size:10px;margin-bottom:8px">⚙ 该材料正在'+wfLabels[m.wf]+'。</div>';
  }

  if(linkedInds.length>0){
    h+='<div style="font-size:10px;margin-bottom:6px"><strong>关联指标 ('+linkedInds.length+'项)</strong></div>';
    linkedInds.forEach(function(i){
      var keys=['requirement','design','implementation','verification','closure'];
      var done=keys.filter(function(k){var s=i.stages[k];return s&&s.wf==='approved'}).length;
      h+='<div style="font-size:9px;padding:2px 0">· '+esc(i.name)+' ['+done+'/5]</div>';
    });
  }

  h+='<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--bd)">';
  h+='<button class="btn btn-xs" style="background:var(--ai);color:#fff;width:100%" onclick="aiPushNotify2(\''+m.id+'\')">📨 推送状态给责任人 '+pn(p,m.owner)+'</button>';
  h+='</div>';

  var body=document.getElementById('aiBody');
  body.innerHTML='<div style="padding:4px;font-size:10px">'+h+'</div>';
  setTimeout(function(){addAIMsg('已分析材料「'+esc(m.name)+'」：'+wfLabels[m.wf]+(linkedInds.length?'，关联'+linkedInds.length+'项指标':''));},100);
}

function aiPushNotify(id){
  var p=AP();var ind=p.indicators.find(function(i){return i.id===id});if(!ind)return;
  var owner=pn(p,ind.owner);
  var keys=['requirement','design','implementation','verification','closure'];
  var done=keys.filter(function(k){var s=ind.stages[k];return s&&s.wf==='approved'}).length;
  var broken=keys.filter(function(k){var s=ind.stages[k];return s&&s.wf==='rejected'}).length;
  var pendingStage=keys.find(function(k){var s=ind.stages[k];return !s||s.wf==='pending'||s.wf==='draft'});
  var labels={requirement:'需求定义',design:'方案设计',implementation:'实施执行',verification:'验收验证',closure:'闭环确认'};
  var msg='📨 已向 '+owner+' 推送指标状态通知：\n';
  msg+='「'+ind.name+'」当前状态：'+done+'/5阶段完成';
  if(broken>0)msg+='，'+broken+'处驳回需处理';
  if(pendingStage)msg+='，下一步：'+labels[pendingStage];
  if(ind.deadline)msg+='，截止日期：'+ind.deadline;
  alert(msg);
  addAIMsg(msg.replace(/\n/g,'<br>'));
}

function aiPushNotify2(id){
  var p=AP();var m=p.materials.find(function(mm){return mm.id===id});if(!m)return;
  var owner=pn(p,m.owner);
  var wfLabels={approved:'已定稿',submitted:'审核中',draft:'编制中',rejected:'退回修订',pending:'待启动'};
  var msg='📨 已向 '+owner+' 推送材料状态通知：\n';
  msg+='「'+m.name+'」当前状态：'+wfLabels[m.wf];
  if(m.deadline)msg+='，截止日期：'+m.deadline;
  if(m.wf==='rejected')msg+='，退回原因：'+esc(m.rjReason||'未说明');
  alert(msg);
  addAIMsg(msg.replace(/\n/g,'<br>'));
}

// ============ IMPORT/EXPORT ============
function exp(){const j=JSON.stringify(D,null,2);const b=new Blob([j],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`验收数据_${nw()}.json`;a.click()}
function imp(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=function(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(ev){try{const d=JSON.parse(ev.target.result);if(!d||!d.projects)throw new Error();if(!confirm(`导入${d.projects.length}个项目？`))return;D=d;save();showV('dash')}catch(err){alert('导入失败')}};r.readAsText(f)};i.click()}

// Modal close
['docModal','indModal','stModal','matModal','mwfModal','orgModal'].forEach(id=>{document.getElementById(id).addEventListener('click',function(e){if(e.target===this){if(id==='docModal')closeDocM();else if(id==='indModal')closeIndM();else if(id==='stModal')closeStM();else if(id==='matModal')closeMatM();else if(id==='mwfModal')closeMwfM();else closeOrgM()}})});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeDocM();closeIndM();closeStM();closeMatM();closeMwfM();closeOrgM()}});

// Init
// Global toggle for AI sections (class ai-tgl)
document.addEventListener('click',function(e){var el=e.target;while(el&&el.className.indexOf('ai-tgl')<0)el=el.parentElement;if(el){var b=el.nextElementSibling;if(b)b.style.display=b.style.display?'':'none'}});
// Init AI panel toggle button visibility
document.getElementById('aiToggle').style.display='none';
showV('dash');
</script>
