<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>环控系统研发验证平台 — 审计指标闭环检查系统</title>
<style>
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --border: #dfe2e7;
  --text: #1d2129;
  --text-secondary: #5a6170;
  --text-muted: #8f95a3;
  --primary: #1b5e3f;
  --primary-light: #e8f5ee;
  --primary-dark: #124a30;
  --success: #1f7d3a;
  --success-light: #edf7f1;
  --warning: #b3540e;
  --warning-light: #fef6ee;
  --danger: #c22d3a;
  --danger-light: #fef0f1;
  --info: #2a6496;
  --info-light: #eef5fb;
  --sidebar-bg: #14181f;
  --sidebar-text: #8a8f9a;
  --sidebar-active: #ffffff;
  --sidebar-hover: #1e232c;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.03);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.05);
  --shadow-lg: 0 4px 20px rgba(0,0,0,0.08);
  --radius-sm: 5px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  --font-mono: "SF Mono", "Cascadia Code", "Consolas", monospace;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  display:flex;
  min-height:100vh;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}

/* === SIDEBAR === */
.sidebar{
  width:230px;
  background:var(--sidebar-bg);
  color:var(--sidebar-text);
  display:flex;
  flex-direction:column;
  position:fixed;
  top:0;left:0;bottom:0;
  z-index:100;
  flex-shrink:0;
  overflow-y:auto;
}
.sidebar-header{
  padding:22px 18px 18px;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.sidebar-header .logo{
  font-size:14px;
  font-weight:700;
  color:var(--sidebar-active);
  letter-spacing:-0.01em;
}
.sidebar-header .logo span{color:#4aad6e;font-weight:800;}
.sidebar-header .sub{
  font-size:10.5px;
  color:var(--sidebar-text);
  margin-top:3px;
  opacity:0.6;
}
.sidebar-nav{flex:1;padding:10px 0;}
.nav-section{
  padding:10px 16px 4px;
  font-size:9.5px;
  text-transform:uppercase;
  letter-spacing:0.1em;
  color:var(--sidebar-text);
  opacity:0.4;
  font-weight:600;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;margin:2px 8px;
  border-radius:var(--radius-sm);
  cursor:pointer;font-size:13px;
  color:var(--sidebar-text);
  transition:all 0.15s;
  border:none;background:none;
  width:calc(100% - 16px);
  text-align:left;
}
.nav-item:hover{background:var(--sidebar-hover);color:#c8cdd5;}
.nav-item.active{background:var(--primary);color:white;}
.nav-item .icon{font-size:15px;width:20px;text-align:center;flex-shrink:0;}
.nav-badge{
  margin-left:auto;
  background:var(--warning);
  color:white;
  font-size:10px;
  padding:1px 7px;
  border-radius:9px;
  font-weight:600;
}
.nav-badge.good{background:var(--success);}
.sidebar-footer{
  padding:14px 16px;
  border-top:1px solid rgba(255,255,255,0.05);
  font-size:10px;
  color:var(--sidebar-text);
  opacity:0.4;
}

/* === MAIN === */
.main{margin-left:230px;flex:1;display:flex;flex-direction:column;min-height:100vh;}

/* Topbar */
.topbar{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:12px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;top:0;z-index:50;
}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-breadcrumb{font-size:12px;color:var(--text-muted);}
.topbar-breadcrumb span{color:var(--text);font-weight:600;}
.topbar-title{font-size:15px;font-weight:600;}
.topbar-actions{display:flex;gap:8px;align-items:center;}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:7px 14px;border-radius:var(--radius-sm);
  font-size:12.5px;font-weight:500;
  font-family:var(--font);cursor:pointer;
  border:1px solid transparent;
  transition:all 0.15s;white-space:nowrap;
}
.btn-primary{background:var(--primary);color:white;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-secondary{background:var(--surface);color:var(--text-secondary);border-color:var(--border);}
.btn-secondary:hover{background:#f0f1f3;}
.btn-sm{padding:4px 10px;font-size:11.5px;}
.btn-xs{padding:3px 8px;font-size:10.5px;border-radius:3px;}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-secondary);}
.btn-ghost:hover{background:rgba(0,0,0,0.03);}
.btn-outline{background:transparent;border-color:var(--primary);color:var(--primary);}
.btn-outline:hover{background:var(--primary-light);}

/* Content */
.content{padding:24px;flex:1;}
.view{display:none;}
.view.active{display:block;}

/* === STATS === */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
  margin-bottom:22px;
}
.stat-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:18px;
}
.stat-card .stat-label{font-size:11.5px;color:var(--text-muted);margin-bottom:6px;}
.stat-card .stat-value{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;}
.stat-card .stat-sub{font-size:11px;color:var(--text-muted);margin-top:4px;}
.stat-card.good .stat-value{color:var(--success);}
.stat-card.warn .stat-value{color:var(--warning);}
.stat-card.bad .stat-value{color:var(--danger);}
.stat-card.info .stat-value{color:var(--info);}

/* === PANELS === */
.panel-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-bottom:22px;
}
.panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  overflow:hidden;
}
.panel-header{
  padding:14px 18px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  background:#fafbfc;
}
.panel-header h3{font-size:13.5px;font-weight:600;}
.panel-body{padding:16px;}

/* Stage flow */
.stage-bar{
  display:flex;
  gap:0;
  margin-bottom:8px;
  position:relative;
}
.stage-step{
  flex:1;
  text-align:center;
  padding:14px 6px 10px;
  position:relative;
  font-size:11px;
  cursor:pointer;
  transition:all 0.2s;
}
.stage-step::after{
  content:'';
  position:absolute;
  top:50%;left:100%;
  width:calc(100% / 5);
  height:2px;
  background:var(--border);
  z-index:0;
}
.stage-step:last-child::after{display:none;}
.stage-step .step-dot{
  width:24px;height:24px;
  border-radius:50%;
  background:var(--border);
  margin:0 auto 6px;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;
  color:white;
  position:relative;z-index:1;
}
.stage-step.done .step-dot{background:var(--success);}
.stage-step.issue .step-dot{background:var(--warning);}
.stage-step.pending .step-dot{background:#c8ccd2;color:#6b7280;}
.stage-step .step-label{font-size:10.5px;color:var(--text-secondary);font-weight:500;margin-top:4px;}
.stage-step.done .step-label{color:var(--success);}
.stage-step.issue .step-label{color:var(--warning);}
.stage-step .step-evidence{font-size:9.5px;color:var(--text-muted);margin-top:2px;line-height:1.3;}

/* Module cards */
.module-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:22px;
}
.module-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:18px;
  cursor:pointer;
  transition:all 0.15s;
}
.module-card:hover{border-color:var(--primary);box-shadow:var(--shadow-md);}
.module-card.selected{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-light);}
.module-card .module-num{
  font-size:10px;font-weight:700;
  color:var(--primary);
  background:var(--primary-light);
  padding:2px 8px;border-radius:10px;
  display:inline-block;margin-bottom:8px;
}
.module-card h4{font-size:13.5px;font-weight:600;margin-bottom:6px;}
.module-card .module-meta{font-size:11px;color:var(--text-muted);}
.module-card .module-progress{
  margin-top:10px;
  height:4px;
  background:#e5e7eb;
  border-radius:2px;
  overflow:hidden;
}
.module-card .module-progress-bar{
  height:100%;
  background:var(--primary);
  border-radius:2px;
  transition:width 0.4s;
}

/* Table */
.table-wrap{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  overflow:hidden;
}
.table-toolbar{
  padding:12px 16px;
  border-bottom:1px solid var(--border);
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
}
.table-toolbar input[type=text]{
  padding:7px 11px;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  font-size:12.5px;font-family:var(--font);
  width:220px;outline:none;
}
.table-toolbar input[type=text]:focus{border-color:var(--primary);}
.table-toolbar select{
  padding:7px 11px;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  font-size:12.5px;font-family:var(--font);
  background:white;cursor:pointer;outline:none;
}
.spacer{flex:1;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
thead th{
  text-align:left;padding:10px 14px;
  font-weight:600;font-size:11.5px;
  color:var(--text-muted);background:#fafbfc;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}
tbody td{
  padding:11px 14px;
  border-bottom:1px solid var(--border);
  vertical-align:middle;
}
tbody tr:hover{background:#fafbfc;}
tbody tr:last-child td{border-bottom:none;}

/* Badges */
.badge{
  display:inline-flex;align-items:center;gap:3px;
  padding:2px 9px;border-radius:10px;
  font-size:10.5px;font-weight:600;
}
.badge-ok{background:var(--success-light);color:var(--success);}
.badge-warn{background:var(--warning-light);color:var(--warning);}
.badge-err{background:var(--danger-light);color:var(--danger);}
.badge-pending{background:#f0f1f3;color:var(--text-muted);}
.badge-info{background:var(--info-light);color:var(--info);}

.stage-dots{display:flex;gap:3px;}
.stage-dot{
  width:8px;height:8px;border-radius:50%;
  background:#d1d5db;
}
.stage-dot.ok{background:var(--success);}
.stage-dot.issue{background:var(--warning);}

/* Detail panel */
.detail-split{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:16px;
  align-items:start;
}
.detail-list{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  overflow:hidden;
}
.detail-list .list-header{
  padding:12px 14px;
  border-bottom:1px solid var(--border);
  font-size:12.5px;font-weight:600;
  background:#fafbfc;
}
.detail-item{
  padding:11px 14px;
  cursor:pointer;
  border-bottom:1px solid var(--border);
  font-size:12.5px;
  display:flex;align-items:center;justify-content:space-between;
  transition:background 0.1s;
}
.detail-item:hover{background:#f8f9fb;}
.detail-item.selected{background:var(--primary-light);border-left:3px solid var(--primary);}
.detail-item:last-child{border-bottom:none;}

.detail-content{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  overflow:hidden;
}
.detail-content .dc-header{
  padding:16px 20px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.detail-content .dc-body{padding:20px;}

/* Requirements mapping */
.req-map-table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}
.req-map-table td, .req-map-table th{
  padding:10px 12px;
  border:1px solid var(--border);
  vertical-align:top;
}
.req-map-table th{
  background:#fafbfc;
  font-size:11px;font-weight:600;
  color:var(--text-secondary);
}
.req-map-table .req-col{width:35%;}
.req-map-table .resp-col{width:55%;}
.req-map-table .status-col{width:10%;text-align:center;}

/* Report */
.report-title{
  text-align:center;
  padding-bottom:16px;
  margin-bottom:20px;
  border-bottom:2px solid var(--border);
}
.report-title h2{font-size:20px;font-weight:700;margin-bottom:6px;}
.report-section{margin-bottom:22px;}
.report-section h3{
  font-size:14px;font-weight:600;
  margin-bottom:12px;padding-bottom:6px;
  border-bottom:1px solid var(--border);
}
.report-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.report-grid-item{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:14px;
  text-align:center;
}
.report-grid-item .val{font-size:22px;font-weight:700;}
.report-grid-item .lbl{font-size:11px;color:var(--text-muted);margin-top:3px;}

/* Modal */
.modal-overlay{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,0.35);
  z-index:1000;
  justify-content:center;align-items:flex-start;
  padding:40px 20px;overflow-y:auto;
}
.modal-overlay.show{display:flex;}
.modal{
  background:var(--surface);
  border-radius:var(--radius-lg);
  width:100%;max-width:680px;
  box-shadow:var(--shadow-lg);
  animation:slideIn 0.2s ease;
}
@keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.modal-header{
  padding:18px 22px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-header h2{font-size:15px;font-weight:600;}
.modal-close{
  width:30px;height:30px;border:none;background:none;
  cursor:pointer;border-radius:var(--radius-sm);
  font-size:18px;color:var(--text-muted);
  display:flex;align-items:center;justify-content:center;
}
.modal-close:hover{background:#f0f1f3;color:var(--text);}
.modal-body{padding:22px;}
.modal-footer{
  padding:14px 22px;
  border-top:1px solid var(--border);
  display:flex;justify-content:flex-end;gap:8px;
}

/* Form */
.form-g{margin-bottom:16px;}
.form-g label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--text);}
.form-g .hint{font-size:11px;color:var(--text-muted);margin-top:3px;}
.form-g .err{font-size:11px;color:var(--danger);margin-top:3px;display:none;}
.form-g.has-err .err{display:block;}
.form-g.has-err input,.form-g.has-err textarea,.form-g.has-err select{border-color:var(--danger);}
.form-input{
  width:100%;padding:8px 11px;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  font-size:12.5px;font-family:var(--font);
  outline:none;background:white;
  transition:border-color 0.15s;
}
.form-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(27,94,63,0.08);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
textarea.form-input{resize:vertical;min-height:70px;}

/* Empty state */
.empty-st{
  text-align:center;padding:50px 20px;color:var(--text-muted);
}
.empty-st .eicon{font-size:42px;margin-bottom:14px;opacity:0.35;}
.empty-st h3{font-size:15px;color:var(--text);margin-bottom:6px;}
.empty-st p{font-size:12.5px;max-width:360px;margin:0 auto;}

/* Risk matrix */
.risk-matrix{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
}
.risk-item{
  padding:12px 14px;
  border-radius:var(--radius-sm);
  font-size:12px;
  display:flex;align-items:flex-start;gap:8px;
}
.risk-L{background:var(--danger-light);border:1px solid #f5c6cb;}
.risk-M{background:var(--warning-light);border:1px solid #ffeeba;}
.risk-H{background:var(--success-light);border:1px solid #c3e6cb;}

/* Print */
@media print{
  .sidebar,.topbar,.btn,.modal-overlay{display:none!important;}
  .main{margin-left:0!important;}
  .content{padding:0!important;}
  .panel-row,.module-grid,.detail-split{grid-template-columns:1fr!important;}
}

@media(max-width:1200px){.stats-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:1024px){
  .module-grid{grid-template-columns:1fr 1fr;}
  .panel-row{grid-template-columns:1fr;}
  .detail-split{grid-template-columns:1fr;}
}
@media(max-width:768px){
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  .module-grid{grid-template-columns:1fr;}
  .sidebar{width:56px;}
  .sidebar-header .logo,.sidebar-header .sub,.nav-section,.nav-item span:not(.icon),.sidebar-footer{display:none;}
  .nav-item{justify-content:center;padding:12px;}
  .main{margin-left:56px;}
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo"><span>&#9678;</span> 审计闭环系统</div>
    <div class="sub">环控系统研发验证平台</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section">概览</div>
    <button class="nav-item active" data-view="overview"><span class="icon">&#9681;</span><span>项目总览</span></button>
    <button class="nav-item" data-view="modules"><span class="icon">&#9638;</span><span>六大模块</span><span class="nav-badge good" id="badge-modules">6</span></button>
    <button class="nav-item" data-view="indicators"><span class="icon">&#9776;</span><span>指标矩阵</span><span class="nav-badge" id="badge-indicators">0</span></button>
    <div class="nav-section">追踪</div>
    <button class="nav-item" data-view="tracking"><span class="icon">&#8644;</span><span>闭环追踪</span></button>
    <button class="nav-item" data-view="mapping"><span class="icon">&#8660;</span><span>需求-方案对照</span></button>
    <div class="nav-section">输出</div>
    <button class="nav-item" data-view="report"><span class="icon">&#9998;</span><span>审计报告</span></button>
    <button class="nav-item" data-view="risks"><span class="icon">&#9888;</span><span>风险清单</span><span class="nav-badge" id="badge-risks">0</span></button>
  </nav>
  <div class="sidebar-footer">v2.0 &copy; 指标闭环检查系统</div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-title" id="topbarTitle">项目总览</span>
      <span class="topbar-breadcrumb">XX车环控系统综合研发及验证平台</span>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-outline btn-sm" onclick="exportData()">导出数据</button>
      <button class="btn btn-secondary btn-sm" onclick="importData()">导入</button>
      <button class="btn btn-secondary btn-sm" onclick="resetToDefault()">恢复默认</button>
    </div>
  </div>
  <div class="content">

    <!-- OVERVIEW -->
    <div class="view active" id="view-overview">
      <div class="stats-grid" id="ovStats"></div>
      <div class="panel-row">
        <div class="panel">
          <div class="panel-header"><h3>五阶段闭环总体进展</h3></div>
          <div class="panel-body" id="ovStageFlow"></div>
        </div>
        <div class="panel">
          <div class="panel-header"><h3>闭环状态分布</h3></div>
          <div class="panel-body" id="ovLoopChart"></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header"><h3>六大模块概览</h3></div>
        <div class="panel-body"><div class="module-grid" id="ovModules"></div></div>
      </div>
    </div>

    <!-- MODULES -->
    <div class="view" id="view-modules">
      <div id="modulesContainer"></div>
    </div>

    <!-- INDICATORS TABLE -->
    <div class="view" id="view-indicators">
      <div class="table-wrap">
        <div class="table-toolbar">
          <input type="text" placeholder="搜索指标..." id="indSearch" oninput="renderIndicatorTable()">
          <select id="indModule" onchange="renderIndicatorTable()"><option value="all">全部模块</option></select>
          <select id="indLoop" onchange="renderIndicatorTable()">

// ============ STORAGE ============
const STORAGE_KEY = 'audit_loop_v2_data';
let indicators = [];

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const data = JSON.parse(raw);
      if(Array.isArray(data) && data.length>0) return data;
    }
  }catch(e){}
  return getDefaultIndicators();
}

function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(indicators)); }

function resetToDefault(){
  if(!confirm('确定恢复为默认数据？当前修改将丢失。')) return;
  indicators = getDefaultIndicators();
  saveData();
  refreshView();
  alert('已恢复默认数据。');
}

indicators = loadData();

document.querySelectorAll('.nav-item').forEach(item=>{
  item.addEventListener('click',function(){
    document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
    this.classList.add('active');
    showView(this.dataset.view);

});

function showView(v){
  currentView = v;
  document.querySelectorAll('.view').forEach(vv=>vv.classList.remove('active'));
  const el = document.getElementById('view-'+v);
  if(el) el.classList.add('active');

    overview:'项目总览',modules:'六大模块',indicators:'指标矩阵',
    tracking:'闭环追踪',mapping:'需求-方案对照',report:'审计报告',risks:'风险清单'
  };
  document.getElementById('topbarTitle').textContent = titles[v]||v;
  refreshView();
}

function refreshView(){
  updateBadges();
  if(currentView==='overview') renderOverview();
  if(currentView==='modules') renderModules();
  if(currentView==='indicators') renderIndicatorTable();
  if(currentView==='tracking') renderTracking();
  if(currentView==='mapping') renderMapping();
  if(currentView==='report') renderReport();
  if(currentView==='risks') renderRisks();
}

function updateBadges(){
  const broken = indicators.filter(i=>getLoopStatus(i)==='broken').length;
  document.getElementById('badge-modules').textContent = '6';
  document.getElementById('badge-indicators').textContent = indicators.length;
  const rb = document.getElementById('badge-risks');
  rb.textContent = broken;
  rb.className = broken>0 ? 'nav-badge' : 'nav-badge good';
}

// ============ HELPERS ============
function getLoopStatus(ind){
  const keys = ['requirement','design','implementation','verification','closure'];
  const vals = keys.map(k=>ind.stages[k].status==='done'?1:ind.stages[k].status==='issue'?0.5:0);
  const done = vals.filter(v=>v===1).length;
  const issues = vals.filter(v=>v===0.5).length;
  if(done===5) return 'closed';
  if(done===0 && issues===0) return 'none';
  if(issues>0) return 'broken';
  if(done>0) return 'partial';
  return 'none';
}

function getModuleName(mid){
  const m = MODULES.find(mm=>mm.id===mid);
  return m ? m.name : mid;
}

function getModuleIndicators(mid){
  return indicators.filter(i=>i.module===mid);
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

// ============ OVERVIEW ============
function renderOverview(){
  const total = indicators.length;
  const closed = indicators.filter(i=>getLoopStatus(i)==='closed').length;
  const broken = indicators.filter(i=>getLoopStatus(i)==='broken').length;
  const partial = indicators.filter(i=>getLoopStatus(i)==='partial').length;

  document.getElementById('ovStats').innerHTML = `
    <div class="stat-card"><div class="stat-label">指标总数</div><div class="stat-value">${total}</div><div class="stat-sub">覆盖7个模块大类</div></div>
    <div class="stat-card good"><div class="stat-label">已闭环</div><div class="stat-value">${closed}</div><div class="stat-sub">闭环率 ${total>0?Math.round(closed/total*100):0}%</div></div>
    <div class="stat-card warn"><div class="stat-label">存在断点</div><div class="stat-value">${broken}</div><div class="stat-sub">需重点关注</div></div>
    <div class="stat-card info"><div class="stat-label">进行中</div><div class="stat-value">${partial}</div><div class="stat-sub">部分阶段已完成</div></div>
    <div class="stat-card ${broken>0?'bad':''}"><div class="stat-label">断点率</div><div class="stat-value">${total>0?Math.round(broken/total*100):0}%</div><div class="stat-sub">${broken}项指标存在断层</div></div>
  `;

  // Stage flow
  const sn = ['需求定义','方案设计','实施执行','验收验证','闭环确认'];
  const sk = ['requirement','design','implementation','verification','closure'];
  let flow = sk.map((k,i)=>{
    const done = indicators.filter(ii=>ii.stages[k].status==='done').length;
    const issue = indicators.filter(ii=>ii.stages[k].status==='issue').length;
    const cls = done===total?'done':issue>0?'issue':'pending';
    return `<div class="stage-step ${cls}">
      <div class="step-dot">${i+1}</div>
      <div class="step-label">${sn[i]}</div>
      <div>${done}/${total}</div>
      ${issue>0?`<div style="font-size:10px;color:var(--warning)">${issue}项问题</div>`:''}
    </div>`;
  }).join('');
  document.getElementById('ovStageFlow').innerHTML = `<div class="stage-bar">${flow}</div>`;

  // Loop chart
  const labels = [
    {k:'closed',l:'已闭环',c:'var(--success)'},
    {k:'partial',l:'进行中',c:'var(--primary)'},
    {k:'broken',l:'存在断点',c:'var(--warning)'},
    {k:'none',l:'未开始',c:'#c8ccd2'}
  ];
  let chart = labels.map(s=>{
    const cnt = indicators.filter(i=>getLoopStatus(i)===s.k).length;
    const pct = total>0?Math.round(cnt/total*100):0;
    return `<div style="flex:1">
      <div style="display:flex;align-items:center;gap:5px;margin-bottom:6px">
        <span style="width:8px;height:8px;border-radius:50%;background:${s.c};flex-shrink:0"></span>
        <span style="font-size:11px;color:var(--text-secondary)">${s.l}</span>
      </div>
      <div style="font-size:18px;font-weight:700">${cnt}<span style="font-size:11px;font-weight:400;color:var(--text-muted)">/${total}</span></div>
      <div style="height:5px;background:#e5e7eb;border-radius:3px;margin-top:6px">
        <div style="height:100%;width:${pct}%;background:${s.c};border-radius:3px;transition:width .4s"></div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('ovLoopChart').innerHTML = `<div style="display:flex;gap:18px;padding:4px 0">${chart}</div>`;

  // Module cards
  document.getElementById('ovModules').innerHTML = MODULES.filter(m=>m.id!=='NF').map(m=>{
    const items = getModuleIndicators(m.id);
    const closed = items.filter(i=>getLoopStatus(i)==='closed').length;
    const pct = items.length>0?Math.round(closed/items.length*100):0;
    return `<div class="module-card" onclick="navigateToModule('${m.id}')">
      <span class="module-num">模块${m.order}</span>
      <h4>${m.name}</h4>
      <div class="module-meta">${items.length}项指标 | ${closed}项已闭环</div>
      <div class="module-progress"><div class="module-progress-bar" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

function navigateToModule(mid){
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  document.querySelector('[data-view="modules"]').classList.add('active');
  showView('modules');
  setTimeout(()=>{
    const el = document.getElementById('module-'+mid);
    if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  },100);
}

// ============ INDICATOR TABLE ============
function renderIndicatorTable(){
  const search = (document.getElementById('indSearch')?.value||'').toLowerCase();
  const mod = document.getElementById('indModule')?.value||'all';
  const loop = document.getElementById('indLoop')?.value||'all';

  // Update module filter
  const ms = document.getElementById('indModule');
  if(ms && ms.options.length<=1){
    ms.innerHTML = '<option value="all">全部模块</option>'+
      MODULES.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
    ms.value = mod;
  }

  let filtered = indicators.filter(i=>{
    if(search && !i.name.toLowerCase().includes(search)) return false;
    if(mod!=='all' && i.module!==mod) return false;
    if(loop!=='all' && getLoopStatus(i)!==loop) return false;
    return true;
  });

  if(filtered.length===0){
    document.getElementById('indTbody').innerHTML='';
    document.getElementById('indEmpty').style.display='block';
    document.getElementById('indCount').textContent='共 0 条';
    return;
  }
  document.getElementById('indEmpty').style.display='none';
  document.getElementById('indCount').textContent=`共 ${filtered.length} 条`;

  const lmap = {closed:'已闭环',partial:'进行中',broken:'存在断点',none:'未开始'};
  const cmap = {closed:'badge-ok',partial:'badge-info',broken:'badge-warn',none:'badge-pending'};

  document.getElementById('indTbody').innerHTML = filtered.map(ind=>{
    const loop = getLoopStatus(ind);
    const dots = ['requirement','design','implementation','verification','closure'].map(k=>
      `<span class="stage-dot ${ind.stages[k].status==='done'?'ok':ind.stages[k].status==='issue'?'issue':''}"></span>`

// ============ TRACKING ============
let trackingSelectedId = null;

function renderTracking(){
  const listEl = document.getElementById('trackList');
  listEl.innerHTML = indicators.map(ind=>{
    const loop = getLoopStatus(ind);
    const cmap = {closed:'badge-ok',partial:'badge-info',broken:'badge-warn',none:'badge-pending'};
    const lmap = {closed:'闭环',partial:'进行',broken:'断点',none:'未开始'};
    return `<div class="detail-item${trackingSelectedId===ind.id?' selected':''}" data-id="${ind.id}" onclick="selectTracking('${ind.id}')">
      <span>${esc(ind.name)}</span>
      <span class="badge ${cmap[loop]}">${lmap[loop]}</span>
    </div>`;
  }).join('');
  if(trackingSelectedId) renderTrackingDetail(trackingSelectedId);
}

function selectTracking(id){
  trackingSelectedId = id;
  document.querySelectorAll('.detail-item').forEach(i=>i.classList.remove('selected'));
  const el = document.querySelector(`.detail-item[data-id="${id}"]`);
  if(el) el.classList.add('selected');
  renderTrackingDetail(id);
}

function renderTrackingDetail(id){
  const ind = indicators.find(i=>i.id===id);
  if(!ind) return;

  const sn = ['需求定义','方案设计','实施执行','验收验证','闭环确认'];
  const sk = ['requirement','design','implementation','verification','closure'];
  const smap = {done:'已完成',issue:'存在问题',pending:'未开始'};
  const vals = sk.map(k=>ind.stages[k].status==='done'?1:ind.stages[k].status==='issue'?0.5:0);
  const breakIdx = vals.findIndex(v=>v===0);
  const loop = getLoopStatus(ind);
  const lmap = {closed:'已闭环',partial:'进行中',broken:'存在断点',none:'未开始'};
  const cmap = {closed:'badge-ok',partial:'badge-info',broken:'badge-warn',none:'badge-pending'};

  const cards = sk.map((k,i)=>{
    const s = ind.stages[k];
    const blocked = breakIdx>=0 && i>breakIdx;
    const stepCls = s.status==='done'?'done':s.status==='issue'?'issue':'pending';
    const cardCls = s.status==='done'?'badge-ok':s.status==='issue'?'badge-warn':'badge-pending';
    return `<div style="border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;${blocked?'opacity:0.5':''}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:white;flex-shrink:0;
            background:${s.status==='done'?'var(--success)':s.status==='issue'?'var(--warning)':'#c8ccd2'}">${i+1}</span>
          <span style="font-weight:600;font-size:13px">${sn[i]}</span>
          ${blocked?'<span style="font-size:10px;color:var(--danger)">（断层阻断）</span>':''}
        </div>
        <span class="badge ${cardCls}">${smap[s.status]}</span>
      </div>
      ${s.desc?`<div style="font-size:12px;margin-bottom:6px;color:var(--text-secondary)">${esc(s.desc)}</div>`:'<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">暂无记录</div>'}
      ${s.evidence?`<div style="font-size:11px;color:var(--text-muted);font-style:italic">依据：${esc(s.evidence)}</div>`:''}
      ${s.date?`<div style="font-size:11px;color:var(--text-muted)">日期：${s.date}</div>`:''}
      <button class="btn btn-xs btn-secondary" style="margin-top:8px" onclick="openStageEdit('${ind.id}','${k}')">编辑</button>
    </div>`;
  }).join('');

  document.getElementById('trackDetail').innerHTML = `
    <div class="detail-content">
      <div class="dc-header">
        <div>
          <h3 style="font-size:15px;font-weight:600;margin-bottom:3px">${esc(ind.name)}</h3>
          <div style="font-size:11px;color:var(--text-muted)">${esc(getModuleName(ind.module))} &middot; ${esc(ind.owner||'未指定')}</div>
        </div>
        <span class="badge ${cmap[loop]}">${lmap[loop]}</span>
      </div>
      <div class="dc-body">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;padding:10px;background:#fafbfc;border-radius:var(--radius-sm);font-size:12px">
          <div>目标/要求：<strong>${esc(ind.target||'-')}</strong></div>
          <div>描述：${esc(ind.desc||'无')}</div>
        </div>
        <div style="display:grid;gap:12px">${cards}</div>
      </div>
    </div>`;
}

// ============ STAGE EDIT ============
let stageEditing = {iid:null,key:null};

function openStageEdit(iid,key){
  const ind = indicators.find(i=>i.id===iid);
  if(!ind) return;
  stageEditing = {iid,key};
  const sn = {requirement:'需求定义',design:'方案设计',implementation:'实施执行',verification:'验收验证',closure:'闭环确认'};
  document.getElementById('stageModalTitle').textContent = `编辑阶段 - ${sn[key]}`;
  const s = ind.stages[key];
  document.getElementById('stageStatus').value = s.status||'pending';
  document.getElementById('stageDesc').value = s.desc||'';
  document.getElementById('stageEvid').value = s.evidence||'';
  document.getElementById('stageDate').value = s.date||'';
  document.getElementById('stageModal').classList.add('show');
}

function closeStageModal(){
  document.getElementById('stageModal').classList.remove('show');
  stageEditing = {iid:null,key:null};
}

function saveStage(){
  if(!stageEditing.iid) return;
  const ind = indicators.find(i=>i.id===stageEditing.iid);
  if(!ind) return;
  ind.stages[stageEditing.key] = {
    status: document.getElementById('stageStatus').value,
    desc: document.getElementById('stageDesc').value.trim(),
    evidence: document.getElementById('stageEvid').value.trim(),
    date: document.getElementById('stageDate').value
  };
  saveData();
  closeStageModal();
  refreshView();
}

// ============ INDICATOR ADD/EDIT ============
let editingIndId = null;

function openIndAddModal(moduleId){
  editingIndId = null;
  document.getElementById('indModalTitle').textContent = '新增指标';
  document.getElementById('fid').value = '';
  document.getElementById('fname').value = '';
  document.getElementById('fmodule').innerHTML = MODULES.map(m=>`<option value="${m.id}"${m.id===moduleId?' selected':''}>${m.name}</option>`).join('');
  document.getElementById('ftarget').value = '';
  document.getElementById('fowner').value = '';
  document.getElementById('fdesc').value = '';
  document.getElementById('fparent').value = moduleId||'';
  document.getElementById('indModal').classList.add('show');
}

function editIndicator(id){
  const ind = indicators.find(i=>i.id===id);
  if(!ind) return;
  editingIndId = id;
  document.getElementById('indModalTitle').textContent = '编辑指标';
  document.getElementById('fid').value = ind.id;
  document.getElementById('fname').value = ind.name;
  document.getElementById('fmodule').innerHTML = MODULES.map(m=>`<option value="${m.id}"${m.id===ind.module?' selected':''}>${m.name}</option>`).join('');
  document.getElementById('ftarget').value = ind.target||'';
  document.getElementById('fowner').value = ind.owner||'';
  document.getElementById('fdesc').value = ind.desc||'';
  document.getElementById('indModal').classList.add('show');
}

function closeIndModal(){
  document.getElementById('indModal').classList.remove('show');
  editingIndId = null;
}

function saveIndicator(){
  const name = document.getElementById('fname').value.trim();
  if(!name){ alert('请输入指标名称'); return; }

  if(editingIndId){
    const ind = indicators.find(i=>i.id===editingIndId);
    if(ind){
      ind.name = name;
      ind.module = document.getElementById('fmodule').value;
      ind.target = document.getElementById('ftarget').value.trim();
      ind.owner = document.getElementById('fowner').value.trim();
      ind.desc = document.getElementById('fdesc').value.trim();
    }
  } else {
    indicators.push({
      id: 'I'+Date.now().toString(36),
      name,
      module: document.getElementById('fmodule').value,
      target: document.getElementById('ftarget').value.trim(),
      owner: document.getElementById('fowner').value.trim(),
      desc: document.getElementById('fdesc').value.trim(),
      createdAt: new Date().toISOString().slice(0,10),
      stages: {
        requirement:{status:'pending',desc:'',evidence:'',date:''},
        design:{status:'pending',desc:'',evidence:'',date:''},
        implementation:{status:'pending',desc:'',evidence:'',date:''},
        verification:{status:'pending',desc:'',evidence:'',date:''},
        closure:{status:'pending',desc:'',evidence:'',date:''}
      }
    });
  }
  saveData();
  closeIndModal();
  refreshView();
}

function delInd(id){
  const ind = indicators.find(i=>i.id===id);
  if(!ind) return;
  if(!confirm(`确定删除指标「${ind.name}」？`)) return;
  indicators = indicators.filter(i=>i.id!==id);
  saveData();
  refreshView();
}

// ============ IMPORT/EXPORT ============
function exportData(){
  const data = JSON.stringify(indicators, null, 2);
  const blob = new Blob([data],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `环控平台_审计闭环数据_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json';
  inp.onchange = function(e){
    const f = e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = function(ev){
      try{
        const data = JSON.parse(ev.target.result);
        if(!Array.isArray(data)) throw new Error('格式错误');
        if(!confirm(`即将导入${data.length}条数据，当前数据将被覆盖。确认？`)) return;
        indicators = data;
        saveData();
        refreshView();
        alert('导入成功');
      }catch(err){
        alert('导入失败：格式不正确');
      }
    };
    r.readAsText(f);
  };
  inp.click();
}

// ============ MODALS ============
document.getElementById('indModal').addEventListener('click',function(e){if(e.target===this)closeIndModal();});
document.getElementById('stageModal').addEventListener('click',function(e){if(e.target===this)closeStageModal();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeIndModal();closeStageModal();}});

// ============ INIT ============
refreshView();
</script>
